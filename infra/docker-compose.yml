services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worklingo
      POSTGRES_PASSWORD: worklingo
      POSTGRES_USER: worklingo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - worklingo-postgres:/var/lib/postgresql/data

volumes:
  worklingo-postgres:
